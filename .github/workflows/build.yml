name: Build Phone Health APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.7
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    # Этот шаг создаст тот самый пропавший jar-файл автоматизации
    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.7

    # Собираем дебаг-версию (она сама подпишется и установится на телефон)
    - name: Build Target APK (Phone Health)
      run: ./gradlew :app:assembleDebug

    - name: Upload Target APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PhoneHealth-Target
        path: app/build/outputs/apk/debug/
